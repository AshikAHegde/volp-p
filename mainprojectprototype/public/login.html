<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>volp.rem — Sign In</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=2.4">
</head>
<body class="login-wrapper">
  <div class="noise-overlay"></div>
  
  <button class="btn btn--icon theme-toggle-fixed" id="themeToggleBtn" aria-label="Toggle Theme">☼</button>

  <div class="login-card">
    <div class="login-brand-header">
      <img src="assets/logo.svg" alt="volp.rem logo" class="login-brand-logo" width="52" height="52">
      <div class="login-header-title">
        <span class="accent">volp</span><span class="brand-dot">.</span><span class="brand-rem">rem</span>
      </div>
      <div class="login-brand-sub">ASSIGNMENT CONSOLE &amp; REMINDERS</div>
    </div>

    <div class="auth-error-banner" id="errorBanner"></div>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group" style="margin-bottom: 16px;">
        <label for="username" class="form-label">Email / Username</label>
        <input 
          type="text" 
          id="username" 
          class="form-input" 
          placeholder="student@university.edu" 
          required 
          autocomplete="username"
        >
      </div>

      <div class="form-group" style="margin-bottom: 24px;">
        <label for="password" class="form-label">Password</label>
        <input 
          type="password" 
          id="password" 
          class="form-input" 
          placeholder="••••••••••••" 
          required 
          autocomplete="current-password"
        >
      </div>

      <button type="submit" class="login-btn-submit" id="loginSubmitBtn">
        LOGIN
      </button>
    </form>

    <div class="demo-creds-box">
      <div><strong>VOLP SECURE GATEWAY</strong></div>
      <div style="margin-top: 4px;">Click to auto-fill test login: <code onclick="fillDemo()">student@university.edu</code></div>
    </div>

    <div class="login-footer-info">
      volp.rem — CONSOLE V1.0
    </div>
  </div>

  <script>
    // Theme toggle
    const themeBtn = document.getElementById('themeToggleBtn');
    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    themeBtn.textContent = savedTheme === 'dark' ? '☼' : '◐';

    themeBtn.addEventListener('click', () => {
      const cur = document.documentElement.getAttribute('data-theme');
      const next = cur === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      themeBtn.textContent = next === 'dark' ? '☼' : '◐';
    });

    function fillDemo() {
      document.getElementById('username').value = 'student@university.edu';
      document.getElementById('password').value = 'password123';
    }

    async function handleLogin(e) {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('loginSubmitBtn');
      const errorBanner = document.getElementById('errorBanner');
      
      errorBanner.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'AUTHENTICATING...';

      try {
        // Attempt backend login first
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        if (response.ok) {
          const data = await response.json();
          localStorage.setItem('volp_user', JSON.stringify({
            email: data.email || username,
            token: data.token || 'demo_token_' + Date.now()
          }));
          window.location.href = 'index.html';
          return;
        } else {
          // If server responded with error, check if offline / fallback
          const errorData = await response.json().catch(() => ({ error: 'Auth failed' }));
          showError(errorData.error || 'Authentication error.');
        }
      } catch (networkErr) {
        // Backend offline or running purely as static HTML: fallback to mock session
        console.warn('Backend unavailable, entering offline demo mode:', networkErr);
        localStorage.setItem('volp_user', JSON.stringify({
          email: username || 'student@university.edu',
          token: 'offline_token_' + Date.now()
        }));
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 600);
      } finally {
        btn.disabled = false;
        btn.textContent = 'LOGIN';
      }
    }

    function showError(msg) {
      const banner = document.getElementById('errorBanner');
      banner.textContent = '⚠ ' + msg;
      banner.style.display = 'block';
    }
  </script>
</body>
</html>
