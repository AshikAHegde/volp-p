<!DOCTYPE html>
<html lang="en" data-theme="light" class="login-page">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VOLP Reminder — Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=Inter:wght@400;500;600;700;800&family=Noto+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,600;1,700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=20261102-formatlogo">
</head>
<body class="login-wrapper">
  <div class="noise-overlay"></div>
  
  <a href="landing.html" class="btn btn--ghost btn--sm back-to-home-btn" title="Back to Home / Landing Page">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"></polyline></svg>
    <span>BACK TO HOME</span>
  </a>

  <button class="btn btn--icon theme-toggle-fixed" id="themeToggleBtn" aria-label="Toggle Theme">☼</button>

  <div class="login-card">
    <a href="landing.html" class="login-brand-header" title="VOLP Reminder Home">
      <div class="login-header-title">
        <span class="brand-logo-pill">VOLP</span>
        <span class="brand-name">REMINDER</span>
      </div>
      <div class="login-header-sub">ASSIGNMENT CONSOLE</div>
    </a>

    <div class="auth-error-banner" id="errorBanner"></div>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group" style="margin-bottom: 16px;">
        <label for="username" class="form-label">Email / Username</label>
        <input 
          type="text" 
          id="username" 
          class="form-input" 
          placeholder="Enter your email or username" 
          required 
          autocomplete="username"
        >
      </div>

      <div class="form-group" style="margin-bottom: 24px;">
        <label for="password" class="form-label">Password</label>
        <input 
          type="password" 
          id="password" 
          class="form-input" 
          placeholder="••••••••••••" 
          required 
          autocomplete="current-password"
        >
      </div>

      <button type="submit" class="login-btn-submit" id="loginSubmitBtn">
        LOGIN
      </button>
    </form>

    <div class="login-footer-info">
      <a href="landing.html" style="color: var(--muted); text-decoration: underline;">Home</a> · <span>VOLP REMINDER — CONSOLE V1.0</span>
    </div>
  </div>

  <script>
    const themeBtn = document.getElementById('themeToggleBtn');
    const savedTheme = localStorage.getItem('theme') || 'light';
    document.documentElement.setAttribute('data-theme', savedTheme);
    themeBtn.textContent = savedTheme === 'dark' ? '☼' : '☼';

    themeBtn.addEventListener('click', () => {
      const cur = document.documentElement.getAttribute('data-theme');
      const next = cur === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      themeBtn.textContent = next === 'dark' ? '☼' : '☼';
    });

    // Show session expiration message if redirected from an expired 2-hour backend session
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('expired') === 'true') {
      const banner = document.getElementById('errorBanner');
      if (banner) {
        banner.textContent = 'Your session expired after 2 hours. Please log in again to continue.';
        banner.style.display = 'block';
      }
    }

    // Submits the login form credentials to the authentication API and saves session data.
    async function handleLogin(e) {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('loginSubmitBtn');
      const errorBanner = document.getElementById('errorBanner');
      
      errorBanner.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'AUTHENTICATING...';

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        if (response.ok) {
          const data = await response.json();
          if (!data.token) {
            showError('Authentication succeeded but no session token was received.');
            return;
          }
          // Persist is_premium in localStorage so premium features show immediately without layout shift
          localStorage.setItem('volp_user', JSON.stringify({
            email: data.email || username,
            token: data.token,
            telegram_chat_id: data.telegram_chat_id || '',
            is_premium: Boolean(data.is_premium)
          }));
          window.location.href = 'dashboard.html';
          return;
        } else {
          const errorData = await response.json().catch(() => ({ error: 'Authentication failed' }));
          showError(errorData.error || 'Invalid credentials or login failed.');
        }
      } catch (networkErr) {
        showError('Unable to connect to authentication server. Please check your network connection.');
      } finally {
        btn.disabled = false;
        btn.textContent = 'LOGIN';
      }
    }

    // Displays an error message banner inside the login card.
    function showError(msg) {
      const banner = document.getElementById('errorBanner');
      banner.textContent = '⚠ ' + msg;
      banner.style.display = 'block';
    }
  </script>
</body>
</html>
